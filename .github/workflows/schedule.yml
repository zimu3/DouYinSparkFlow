name: DouYin Spark Flow Daily Trial

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke checks login and target without sending; send submits one message per target'
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - send
      test_message:
        description: 'Optional one-time message for a manual send; scheduled runs keep MESSAGE_TEMPLATE'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '17 15 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

concurrency:
  group: douyin-32120635840
  cancel-in-progress: false

jobs:
  run-main:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps --only-shell
      - name: Run ordinary Douyin web chat workflow
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
          TASKS: ${{ vars.TASKS }}
          MATCH_MODE: ${{ vars.MATCH_MODE }}
          MESSAGE_TEMPLATE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_message != '' && inputs.test_message || vars.MESSAGE_TEMPLATE }}
          COOKIES_32120635840: ${{ secrets.COOKIES_32120635840 }}
        run: python main.py
