name: DouYin Spark Flow One-time Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-main:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps --only-shell
      - name: Send the configured one-time message
        env:
          TASKS: ${{ vars.TASKS }}
          MATCH_MODE: ${{ vars.MATCH_MODE }}
          MESSAGE_TEMPLATE: ${{ vars.MESSAGE_TEMPLATE }}
          COOKIES_32120635840: ${{ secrets.COOKIES_32120635840 }}
        run: python main.py
